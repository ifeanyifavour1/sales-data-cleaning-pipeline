<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sales Data Cleaner</title>
</head>

<body>

    <h1>Sales Data Cleaner</h1>

    <p>Upload your CSV file to begin.</p>

    <form method="POST" enctype="multipart/form-data">

        <label for="csv_file">Choose CSV file:</label>

        <input
            type="file"
            id="csv_file"
            name="csv_file"
            accept=".csv"
        >

        <button type="submit">Upload</button>

    </form>

</body>

</html>
